name: fase3-detalhes

on:
  push:
    branches: [arena/68e80fa4-aria-repository]
  workflow_dispatch:

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  web:
    name: web-detalhes
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/integrate-deepseek-harness-v0.2.1-rc.2
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
      - run: pnpm install --frozen-lockfile
      - name: Build artifacts
        run: pnpm run build:artifacts
      - name: Subir servidor e medir resposta
        run: |
          (pnpm dsh web --no-open --port 3085 > /tmp/web.log 2>&1 &)
          code=000
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3085/ || true)
            [ "$code" != "000" ] && break
            sleep 2
          done
          ct=$(curl -s -o /tmp/page.html -w "%{content_type}" http://127.0.0.1:3085/)
          bytes=$(wc -c < /tmp/page.html)
          title=$(grep -oE "<title>[^<]*</title>" /tmp/page.html | head -1 | sed 's/<[^>]*>//g')
          logtail=$(tail -6 /tmp/web.log | tr '\n' ' ')
          echo "::warning::WEB status=$code content_type=$ct bytes=$bytes title=[$title]"
          echo "::warning::WEB log=[$logtail]"
          for p in /api /health /api/health; do
            c=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3085$p" || true)
            echo "::warning::ROTA $p -> $c"
          done
          asset=$(grep -oE '(src|href)="[^"]*\.js"' /tmp/page.html | sed -E 's/.*="([^"]*)"/\1/' | head -1)
          if [ -n "$asset" ]; then
            ac=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3085$asset" || true)
            echo "::warning::ASSET $asset -> $ac"
          else
            echo "::warning::ASSET nenhum script encontrado no HTML"
          fi

  headless:
    name: headless-detalhes
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/integrate-deepseek-harness-v0.2.1-rc.2
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
      - run: pnpm install --frozen-lockfile
      - name: Executar headless com provider falso
        run: |
          set +e
          timeout 200 pnpm dsh headless --patch apps/cli/tests/profiles/headless/tests/fixtures/headless-profile.patch.yml "Responda OK." > /tmp/hl.out 2> /tmp/hl.err
          rc=$?
          err=$(tail -10 /tmp/hl.err | tr '\n' ' ' | cut -c1-800)
          out=$(tail -5 /tmp/hl.out | tr '\n' ' ' | cut -c1-500)
          echo "::warning::HEADLESS exit=$rc"
          echo "::warning::HEADLESS stderr=[$err]"
          echo "::warning::HEADLESS stdout=[$out]"
          echo "detalhes do headless coletados (nao falha o job)"

  desktop:
    name: desktop-build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/integrate-deepseek-harness-v0.2.1-rc.2
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
      - run: pnpm install --frozen-lockfile
      - name: Compilar o desktop sem abrir janela
        run: |
          set +e
          pnpm run build:desktop > /tmp/desktop.log 2>&1
          rc=$?
          tail=$(tail -6 /tmp/desktop.log | tr '\n' ' ' | cut -c1-700)
          n=$(find apps/desktop/lib apps/desktop/dist -type f 2>/dev/null | wc -l)
          echo "::warning::DESKTOP exit=$rc artefatos=$n"
          echo "::warning::DESKTOP tail=[$tail]"
          if [ $rc -ne 0 ]; then exit 1; fi
