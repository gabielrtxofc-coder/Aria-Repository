name: fase3-foco

on:
  push:
    branches: [arena/68e80fa4-aria-repository]
  workflow_dispatch:

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  llm:
    name: identificar-falha-ia
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/integrate-deepseek-harness-v0.2.1-rc.2
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
      - run: pnpm install --frozen-lockfile
      - name: vitest llm (detalhado)
        run: |
          set +e
          pnpm exec vitest run packages/llm/llm-deepseek packages/llm/llm > /tmp/llm.log 2>&1
          rc=$?
          echo "::warning::LLM exit=$rc"
          grep -aE "FAIL|✗|×|AssertionError|Error:" /tmp/llm.log | head -6 | while IFS= read -r line; do
            echo "::warning::LINHA ${line}"
          done
          grep -a -A6 "Failed Tests 1" /tmp/llm.log | head -14 | while IFS= read -r line; do
            echo "::warning::DETALHE ${line}"
          done

  ferramentas:
    name: ferramentas-build-native
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/integrate-deepseek-harness-v0.2.1-rc.2
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
      - run: pnpm install --frozen-lockfile
      - name: Build artefatos + nativo
        run: |
          set +e
          pnpm run build:artifacts > /tmp/ba.log 2>&1
          echo "::warning::ARTEFATOS exit=$?"
          pnpm run build:native-system > /tmp/bn.log 2>&1
          echo "::warning::NATIVO exit=$? tail=[$(tail -3 /tmp/bn.log | tr '\n' ' ' | cut -c1-400)]"
      - name: Headless com ferramenta real e sandbox
        run: |
          set +e
          bash scripts/prepare-ci-bubblewrap.sh > /tmp/bw.log 2>&1
          cd /tmp && rm -rf t2 && mkdir t2 && cd t2
          timeout 240 pnpm --dir /home/runner/work/Aria-Repository/Aria-Repository dsh headless \
            --patch /home/runner/work/Aria-Repository/Aria-Repository/apps/cli/tests/profiles/headless/tests/fixtures/headless-profile.patch.yml \
            "Use a ferramenta de shell para rodar echo teste." > out.txt 2> err.txt
          rc=$?
          echo "::warning::TOOL2 exit=$rc"
          echo "::warning::TOOL2 stdout=[$(tail -10 out.txt | tr '\n' ' ' | cut -c1-800)]"
          echo "::warning::TOOL2 stderr=[$(tail -4 err.txt | tr '\n' ' ' | cut -c1-400)]"
          echo "::warning::TOOL2 arquivos_criados=$(ls -1 | wc -l)"
