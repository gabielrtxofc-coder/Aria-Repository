name: verify-rc2-static

# Verificação temporária de investigação.
# Reproduz o gate "node 24 / static" do ci.yml no MESMO código do PR #14,
# mas num runner padrão do GitHub em vez do pool corporativo dsh-*-16core.
# Não altera o ci.yml nem a branch do PR.

on:
  push:
    branches: [arena/68e80fa4-aria-repository]
  workflow_dispatch:

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'
  # Base confiável (tip da main) para o gate de archive.
  DSH_ARCHIVE_BASE_REF: '816b8f4d6d77dfeab4e9c6e3aa3394bcdff72102'

jobs:
  static-on-hosted:
    name: static gate on github-hosted
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Use runner-owned temporary storage
        run: echo "TMPDIR=${{ runner.temp }}" >> "$GITHUB_ENV"

      # Código exato do PR #14 (branch da versão 0.2.1-rc.2).
      - uses: actions/checkout@v4
        with:
          ref: feat/integrate-deepseek-harness-v0.2.1-rc.2
          fetch-depth: 0
          persist-credentials: false

      - name: Show resolved version
        run: node -p "require('./package.json').version"

      - name: Redirect Node compile cache to runner temp
        run: echo "NODE_COMPILE_CACHE=${{ runner.temp }}/node-compile-cache" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Report toolchain
        run: |
          node -v
          pnpm -v

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Run static gates
        env:
          DSH_GATE_FAIL_FAST: '1'
        run: pnpm run check:ci:static
