name: runner-label-probe

# Sonda temporária: verifica quais labels de runner do GitHub estão disponíveis
# para este repositório. Será removida após a investigação.
on:
  push:
    branches: [arena/68e80fa4-aria-repository]
  workflow_dispatch:

jobs:
  probe:
    name: probe ${{ matrix.label }}
    runs-on: ${{ matrix.label }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        label: [ubuntu-24.04, ubuntu-latest, windows-2025, windows-latest]
    steps:
      - name: Report runner facts
        shell: bash
        run: |
          echo "label=${{ matrix.label }}"
          echo "runner_os=${{ runner.os }}"
          echo "runner_arch=${{ runner.arch }}"
          echo "cpus=$(nproc 2>/dev/null || echo n/a)"
          echo "node=$(node -v 2>/dev/null || echo absent)"
          echo "PROBE_OK"
