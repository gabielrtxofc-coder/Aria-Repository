name: fase3-final

on:
  push:
    branches: [arena/68e80fa4-aria-repository]
  workflow_dispatch:

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  ferramentas:
    name: ferramentas-com-sandbox
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/integrate-deepseek-harness-v0.2.1-rc.2
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
      - run: pnpm install --frozen-lockfile
      - name: Preparar bubblewrap (sandbox do projeto)
        run: |
          set +e
          bash scripts/prepare-ci-bubblewrap.sh > /tmp/bwrap.log 2>&1
          echo "::warning::BWRAP exit=$? tail=[$(tail -3 /tmp/bwrap.log | tr '\n' ' ' | cut -c1-400)]"
      - name: Headless com ferramenta real
        run: |
          set +e
          export HOME=/home/runner
          cd /tmp && rm -rf t1 && mkdir t1 && cd t1
          timeout 240 pnpm --dir /home/runner/work/Aria-Repository/Aria-Repository dsh headless \
            --patch /home/runner/work/Aria-Repository/Aria-Repository/apps/cli/tests/profiles/headless/tests/fixtures/headless-profile.patch.yml \
            "Use a ferramenta de shell para rodar echo teste." > out.txt 2> err.txt
          rc=$?
          echo "::warning::TOOL exit=$rc"
          echo "::warning::TOOL stdout=[$(tail -10 out.txt | tr '\n' ' ' | cut -c1-900)]"
          echo "::warning::TOOL stderr=[$(tail -4 err.txt | tr '\n' ' ' | cut -c1-500)]"
          echo "::warning::TOOL sessoes=$(find /home/runner -name '*.jsonl' -path '*sessions*' 2>/dev/null | wc -l)"

  arquivos:
    name: testes-arquivos
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/integrate-deepseek-harness-v0.2.1-rc.2
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
      - run: pnpm install --frozen-lockfile
      - name: vitest fs
        run: |
          set +e
          pnpm exec vitest run packages/fs/fs packages/fs/tool-fs > /tmp/fs.log 2>&1
          rc=$?
          echo "::warning::FS exit=$rc resumo=[$(grep -E 'Test Files|Tests ' /tmp/fs.log | tr '\n' ' ' | cut -c1-300)]"

  ia:
    name: testes-camada-ia
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/integrate-deepseek-harness-v0.2.1-rc.2
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
      - run: pnpm install --frozen-lockfile
      - name: vitest llm
        run: |
          set +e
          pnpm exec vitest run packages/llm/llm-deepseek packages/llm/llm > /tmp/llm.log 2>&1
          rc=$?
          echo "::warning::LLM exit=$rc resumo=[$(grep -E 'Test Files|Tests ' /tmp/llm.log | tr '\n' ' ' | cut -c1-300)]"

  desktop-tests:
    name: testes-desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/integrate-deepseek-harness-v0.2.1-rc.2
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
      - run: pnpm install --frozen-lockfile
      - name: vitest apps/desktop
        run: |
          set +e
          pnpm exec vitest run apps/desktop > /tmp/dt.log 2>&1
          rc=$?
          echo "::warning::DESKTOP_TESTES exit=$rc resumo=[$(grep -E 'Test Files|Tests ' /tmp/dt.log | tr '\n' ' ' | cut -c1-300)]"
          echo "::warning::DESKTOP_TESTES erro=[$(grep -iE 'error|failed' /tmp/dt.log | head -3 | tr '\n' ' ' | cut -c1-500)]"
